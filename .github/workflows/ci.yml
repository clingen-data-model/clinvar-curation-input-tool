name: CI

# Build + test the review-app on every PR/push that touches it. No secrets, no
# deploy — this just gates merges on green tests + a clean web build.
on:
  push:
    paths: ['review-app/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['review-app/**', '.github/workflows/ci.yml']

jobs:
  functions-tests:
    name: functions — vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review-app/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: review-app/functions/package-lock.json
      - run: npm ci
      - run: npm test

  web-build:
    name: web — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review-app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: review-app/web/package-lock.json
      - run: npm ci
      - run: npm run build
