name: Deploy (prod)

# DORMANT DRAFT — go-live is parked, so prod deploy is manual-only and gated by a
# protected `production` environment (add a required reviewer in repo settings).
# Enable by configuring the prod credential (CI-CD-SETUP.md) + the environment.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-prod" to confirm a production deploy'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: build + deploy → clingen-cvc (PROD)
    if: ${{ github.event.inputs.confirm == 'deploy-prod' }}
    runs-on: ubuntu-latest
    environment: production   # protect with a required reviewer in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build web
        working-directory: review-app/web
        run: npm ci && npm run build
      - name: Install functions deps
        working-directory: review-app/functions
        run: npm ci
      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.CI_DEPLOY_SA_PROD }}
      - name: Deploy hosting + functions
        working-directory: review-app
        run: npx firebase-tools@latest deploy --only hosting,functions --project clingen-cvc --non-interactive
      - name: Re-grant runtime IAM
        working-directory: review-app
        run: SA=${{ vars.RUNTIME_SA_PROD }} WRITE_DATASET=clinvar_curator_v4 bash scripts/grant-iam.sh || true
