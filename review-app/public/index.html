<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CvC Review &amp; Submit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="dev-banner" hidden>DEV</div>
  <header>
    <h1>ClinVar Curator — Review &amp; Submit</h1>
    <div id="whoami"></div>
    <button id="signin">Sign in with Google</button>
    <button id="signout" hidden>Sign out</button>
  </header>

  <section id="app" hidden>
    <div id="batch-panel">
      <span>Next batch: <strong id="next-batch">…</strong></span>
      <button id="reload" class="secondary">Reload queue</button>
      <button id="generate" class="secondary">Generate file</button>
      <button id="finalize" class="secondary">Finalize batch</button>
      <span id="assigned-count"></span>
    </div>
    <div id="review-actions">
      <button id="save-all" disabled>Save all</button>
      <span id="unsaved" class="unsaved" hidden></span>
      <span class="sep">·</span>
      <button id="assign-selected" class="secondary" disabled>Add selected to batch</button>
      <button id="unassign-selected" class="secondary" disabled>Unassign selected</button>
      <span id="selected-count"></span>
    </div>
    <div id="result"></div>
    <div id="status">Loading…</div>
    <div id="queue" hidden></div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
  <script src="/__/firebase/init.js?useEmulator=false"></script>
  <script src="app.js"></script>
</body>
</html>
